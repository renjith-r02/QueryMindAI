[project]
name = "querymind-api"
version = "0.1.0"
description = "FastAPI service for QueryMind."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "querymindai",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
# Shared indexing, RAG and agent code; edits there apply without reinstalling.
querymindai = { path = "../querymind-agentic", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
